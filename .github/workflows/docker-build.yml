name: Build and publish Docker image

# Reusable build shared by both release channels, so they cannot drift apart:
#   docker.yml      -> ghcr.io/orangecoding/fredy             (master + release tags)
#   pre-release.yml -> ghcr.io/orangecoding/fredy-pre-release (develop + *-pre.* tags)
#
# Each architecture builds on a runner of its own architecture and pushes an image with no tag,
# addressed by digest; `merge` then joins those digests under the tags. The alternative is one
# runner emulating the other architecture through QEMU, which cost five times what the native
# half did and was most of the build.

on:
  workflow_call:
    inputs:
      image_name:
        description: 'Image repository without the registry, e.g. orangecoding/fredy'
        required: true
        type: string
      tags:
        description: 'tags input passed through to docker/metadata-action'
        required: true
        type: string

env:
  REGISTRY: ghcr.io

jobs:
  build:
    strategy:
      # One architecture failing still leaves the other's log worth reading.
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm

    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write

    # A newer push replaces this one. `merge` needs `build`, so it is skipped along with it.
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-${{ matrix.platform }}
      cancel-in-progress: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # Names the cache scope and the digest artifact, neither of which may hold a slash.
      - name: Name this architecture
        run: echo "PLATFORM_SLUG=${{ matrix.platform }}" | tr '/' '-' >> "$GITHUB_ENV"

      # A repository whose owner is capitalised is not a valid image reference. Both jobs address
      # the image by hand, so neither goes through the lowercasing metadata-action does on its own.
      - name: Name the image
        env:
          IMAGE_NAME: ${{ inputs.image_name }}
        run: echo "IMAGE=${REGISTRY}/${IMAGE_NAME,,}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tags belong to the manifest list `merge` writes, so this run reads the labels only.
      - name: Extract labels for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          # Per architecture, so the two builds cannot evict each other's layers.
          cache-from: type=gha,scope=${{ env.PLATFORM_SLUG }}
          cache-to: type=gha,mode=max,scope=${{ env.PLATFORM_SLUG }}

      - name: Hand the digest to the merge job
        run: |
          mkdir -p /tmp/digests
          digest='${{ steps.build.outputs.digest }}'
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ env.PLATFORM_SLUG }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      packages: write

    steps:
      - name: Name the image
        env:
          IMAGE_NAME: ${{ inputs.image_name }}
        run: echo "IMAGE=${REGISTRY}/${IMAGE_NAME,,}" >> "$GITHUB_ENV"

      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: ${{ inputs.tags }}

      - name: Join the per-architecture images under the tags
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.IMAGE }}@sha256:%s ' *)

      - name: Inspect image
        run: |
          docker buildx imagetools inspect "${IMAGE}:${{ steps.meta.outputs.version }}"

      # The published image, not a rebuild of it. The container carries its own HEALTHCHECK, so
      # what this waits for is the same answer a deployment waits for.
      - name: Test the published image
        run: |
          docker run -d --name fredy "${IMAGE}:${{ steps.meta.outputs.version }}"

          for attempt in $(seq 1 36); do
            state=$(docker inspect --format '{{.State.Status}}' fredy 2>/dev/null || echo gone)
            health=$(docker inspect --format '{{.State.Health.Status}}' fredy 2>/dev/null || echo none)
            echo "[$attempt] container: $state, health: $health"

            if [ "$health" = "healthy" ]; then
              docker rm -f fredy
              exit 0
            fi
            if [ "$state" != "running" ] || [ "$health" = "unhealthy" ]; then
              docker logs fredy
              exit 1
            fi
            sleep 5
          done

          echo "The container never reported healthy."
          docker logs fredy
          exit 1
